version: 2

# Dependabot reads this file from the default branch only, but pre-release is
# where check.yml runs, so updates are opened there and reach main through the
# normal promotion instead of landing unvalidated on the live branch.
updates:
  # Actions are pinned by commit SHA; Dependabot keeps the pins moving.
  - package-ecosystem: github-actions
    directory: /
    target-branch: pre-release
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    target-branch: pre-release
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    # TS 7 breaks @astrojs/check (no Language Service API yet). Stay on 6.x
    # until Astro supports native TypeScript 7 — see withastro/roadmap#1321.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
