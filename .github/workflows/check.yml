name: Validate content and build

# Catches broken content edits on the integration branch, before they are
# promoted to main and hit the deploy workflow.
on:
  pull_request:
  push:
    branches: [pre-release]
  workflow_dispatch:

# Read-only: this workflow must never publish.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci enforces package-lock.json — no surprise transitive upgrades in CI
      - name: Install dependencies
        run: npm ci

      # Fails on invalid content schemas, stage-schedule ids, and type errors
      - name: Type check and build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Run unit tests
        run: npm test
