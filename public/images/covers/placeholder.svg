<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cover placeholder">
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="55%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#0e1016"/>
    </linearGradient>
    <linearGradient id="cover-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cover-bg)"/>
  <rect width="512" height="512" fill="url(#cover-sheen)"/>
  <!-- Vinyl-style ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#8b93a7" stroke-opacity="0.22" stroke-width="10"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#8b93a7" stroke-opacity="0.14" stroke-width="4"/>
  <circle cx="256" cy="256" r="28" fill="#8b93a7" fill-opacity="0.2"/>
  <text
    x="256"
    y="420"
    text-anchor="middle"
    fill="#8b93a7"
    fill-opacity="0.7"
    font-family="system-ui, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="0.32em"
  >NO COVER</text>
</svg>
