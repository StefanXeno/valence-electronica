name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy to GitHub Pages
        required: true
        default: main
        type: choice
        options:
          - main
          - pre-release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Push to main → deploy that commit. Manual run → selected branch (e.g. pre-release).
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}
      # Runs the package "build" script (astro check && astro build) and uploads dist/
      - name: Install, check, build, and upload site
        uses: withastro/action@v6
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
